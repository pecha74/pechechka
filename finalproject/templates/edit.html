{% extends 'base.html' %}

{% block content %}
<h2>Редактировать операцию</h2>
<form method="POST">
    <div class="mb-3">
        <label for="date" class="form-label">Дата</label>
        <input type="date" class="form-control" id="date" name="date" value="{{ record.date }}" required>
    </div>
    <div class="mb-3">
        <label for="category" class="form-label">Категория</label>
        <input type="text" class="form-control" id="category" name="category" value="{{ record.category }}" required>
    </div>
    <div class="mb-3">
        <label for="amount" class="form-label">Сумма (₽)</label>
        <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ record.amount }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Тип</label><br>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="type" id="income" value="income" {% if record.type == 'income' %}checked{% endif %}>
            <label class="form-check-label" for="income">Доход</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="type" id="expense" value="expense" {% if record.type == 'expense' %}checked{% endif %}>
            <label class="form-check-label" for="expense">Расход</label>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="/" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}

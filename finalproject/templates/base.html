<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Финансовый трекер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Финансовый трекер</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    {% if session.username %}
                        <span class="nav-link text-light">Привет, {{ session.username }}</span>
                        <a class="nav-link" href="/">Все</a>
                        <a class="nav-link" href="/add">Добавить</a>
                        <a class="nav-link" href="/stats">Статистика</a>
                        <a class="nav-link" href="/chart">Диаграмма</a>
                        <a class="nav-link" href="/advanced_stats">📊 Расширенная статистика</a>
                        <a class="nav-link" href="/logout">Выйти</a>
                    {% else %}
                        <a class="nav-link" href="/login">Вход</a>
                        <a class="nav-link" href="/register">Регистрация</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
